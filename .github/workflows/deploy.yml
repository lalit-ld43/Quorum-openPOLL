name: Deploy to Preprod
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'contracts/**'
      - 'preprod-deployment/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd preprod-deployment
          npm install
          npm install --no-save tsx
          node infra/scripts/patch-wallet-sdk.mjs

      - name: Copy Contract
        run: |
          cp contracts/voting.compact preprod-deployment/contracts/src/voting.compact

      - name: Compile Contract
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          compact update 0.31.1 || compact update 0.31.0
          compact --version
          cd preprod-deployment/contracts
          compact compile src/voting.compact ./src/managed/voting
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Contract Bindings
        run: |
          cd preprod-deployment/contracts
          npm run build

      - name: Build API
        run: |
          cd preprod-deployment/api
          npm run build

      - name: Commit built artifacts for Vercel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main --autostash
          git add -f preprod-deployment/contracts/src/managed/
          git add -f preprod-deployment/contracts/dist/
          git add -f preprod-deployment/api/dist/
          git diff --cached --quiet || git commit -m "chore: commit built contract & api artifacts for Vercel [skip ci]"
          git push

      - name: Increase swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /swapfile_extra || true
          sudo fallocate -l 10G /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=10240
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          free -h

      - name: Deploy Contract
        run: |
          cd preprod-deployment/cli
          npx tsx src/launcher/deploy-voting.ts
        env:
          NODE_OPTIONS: "--max-old-space-size=8192 --expose-gc"
          WALLET_SEED: "b13ef2c445dd8c7c5f5586a2b1f18b6135d7acc340a749e69d5b456ff935614"

      - name: Upload Deployment Info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info
          path: |
            preprod-deployment/cli/deployment.json
            deployed_contract.json
